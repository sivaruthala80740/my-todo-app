<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro To-Do - B.Tech Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📚 My Tasks</h1>
      <button id="themeBtn" onclick="toggleTheme()">🌙</button>
    </div>
    
    <div class="input-box">
      <input type="text" id="taskInput" placeholder="Add new task...">
      <select id="priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button onclick="addTask()">Add</button>
    </div>

    <div class="filters">
      <button onclick="filterTasks('all')" class="active">All</button>
      <button onclick="filterTasks('pending')">Pending</button>
      <button onclick="filterTasks('done')">Done</button>
      <span id="count">0 tasks</span>
    </div>

    <ul id="taskList"></ul>
    <button class="clear-btn" onclick="clearAll()">Clear All</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
